[tool.poetry]
name = "serafort-sdk"
version = "0.1.0"
description = "Serafort B2B and Machine Identity SDK"
authors = ["Serafort Team <eng@serafort.com>"]
readme = "README.md"
packages = [{include = "serafort"}]

[tool.poetry.dependencies]
python = "^3.10"
httpx = "^0.25.0"
pyjwt = {extras = ["crypto"], version = "^2.8.0"}
pydantic = "^2.5.0"
cryptography = "^42.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
pytest-asyncio = "^0.23.0"
mypy = "^1.10.0"
ruff = "^0.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 170

[tool.ruff.lint]
select = ["E", "F", "I"]
